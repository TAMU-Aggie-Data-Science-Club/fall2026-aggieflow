[project]
name = "aggieflow"
version = "0.1.0"
description = "AggieFlow: a cited-answer assistant for Texas A&M students"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain>=1.4,<2",
    "langchain-groq>=1.1,<2",
    "python-dotenv>=1.2",
    "pymongo>=4.9,<5",
    "requests>=2.32,<3",        # live anex.us grades, and the collectors
    "beautifulsoup4>=4.12,<5",  # the collectors' HTML parsing
]

[dependency-groups]
dev = [
    "langsmith[pytest]>=0.4",
    "pytest>=9",
]

[tool.uv]
package = false  # an app, not a library: uv installs its dependencies, not the project itself

[tool.pytest.ini_options]
pythonpath = ["."]  # so `uv run pytest` finds agent/ and pipeline/
testpaths = ["tests"]
# langsmith's pytest plugin uses an asyncio call Python 3.14 deprecates; not ours to fix.
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]
# Offline tests only by default. Run the live ones with `uv run pytest -m live`.
addopts = ["-m", "not live"]
markers = [
    "live: calls a real model API (needs keys); skipped unless you pass -m live",
]
