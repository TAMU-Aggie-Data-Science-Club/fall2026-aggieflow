name: Tests

# Runs the offline tests (no API keys, no Atlas, no network) when a PR or push
# changes code. Docs-only changes skip it.
on:
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "pipeline/**"
      - "eval/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "pipeline/**"
      - "eval/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails if pyproject.toml changed without updating uv.lock.
      - name: Install
        run: uv sync --locked

      # Live tests call real APIs and need keys, so CI runs only the offline ones.
      - name: Run tests
        run: uv run --locked pytest -q -m "not live"
